[workspace]
resolver = "2"
members = [
    "crates/arena-core",
    "crates/arena-host",
    "bots/greedy",
    "bots/ambusher",
    "fixtures/spinner",
    "fixtures/memory-hog",
]
default-members = ["crates/arena-core", "crates/arena-host"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
wasmtime = { version = "46.0.1", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "46.0.1", default-features = false, features = ["p2"] }
wit-bindgen = "0.59.0"

[profile.release]
lto = "thin"
strip = "symbols"
